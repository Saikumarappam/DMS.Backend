<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ProfitShield Document Management System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ProfitShield">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>

  <title>ProfitShield</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #00234E;
    }
    .ps-boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #00234E;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    .ps-boot.hide {
      opacity: 0;
      pointer-events: none;
    }
    .ps-boot-mark {
      position: relative;
      width: 112px;
      height: 112px;
    }
    .ps-boot-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid rgba(173, 132, 38, 0.2);
      border-top-color: #AD8426;
      animation: ps-spin 0.9s linear infinite;
    }
    .ps-boot-icon {
      position: absolute;
      inset: 16px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00234E;
      font-family: Segoe UI, sans-serif;
      font-size: 28px;
      font-weight: 800;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    }
    .ps-boot-label {
      margin-top: 20px;
      color: #fff;
      font-family: Segoe UI, sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    @keyframes ps-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="ps-boot" id="ps-boot">
    <div class="ps-boot-mark">
      <div class="ps-boot-ring"></div>
      <div class="ps-boot-icon">PS</div>
    </div>
    <div class="ps-boot-label">ProfitShield</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('ps-boot');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 280);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
